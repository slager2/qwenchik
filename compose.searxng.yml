services:
  searxng:
    image: searxng/searxng@sha256:ad273460b12390ab1ad9c6ea630dafed39045ab0b9096a85ca31f5246517c670
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8081/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Export SEARXNG_SECRET before starting SearXNG}"
    volumes:
      - "searxng-config:/etc/searxng"
      - "./searxng-settings.yml:/etc/searxng/settings.yml:ro"
      - "searxng-cache:/var/cache/searxng"
    read_only: true
    tmpfs:
      - "/tmp:size=64m,noexec,nosuid"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  searxng-config:
  searxng-cache:
